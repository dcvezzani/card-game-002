<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rec Room — Card Fan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page page--fit">
    <a class="skip-link" href="#main">Skip to table</a>
    <header class="band">
      <a class="brand" href="/">Rec Room</a>
      <div class="row">
        <div class="player-chip is-turn">
          <span class="avatar" aria-hidden="true">Y</span>
          You
        </div>
        <div class="player-chip is-ready">
          <span class="avatar" aria-hidden="true">B</span>
          Bo
        </div>
        <nav class="row">
          <a href="/style-guide.html">Style guide</a>
        </nav>
      </div>
    </header>
    <main id="main" class="page-body">
      <div class="arena" aria-label="Game table">
        <div
          id="hand"
          class="hand"
          role="list"
          aria-label="Hand of cards 1 through 13"
        ></div>
      </div>
    </main>
    <footer class="band">
      <span id="turn-copy">Your turn — pick a card</span>
      <button class="btn btn-secondary" id="play" type="button">Play</button>
    </footer>
    <script src="/app.js" type="module"></script>
  </body>
</html>
