<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rec Room — Phase 10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page page--fit">
    <a class="skip-link" href="#main">Skip to table</a>
    <header class="band">
      <a class="brand" href="/">Rec Room</a>
      <div class="row">
        <div id="table-controls" class="table-controls" hidden>
          <button class="btn btn-secondary" id="end-game" type="button" disabled>End game</button>
          <button class="btn btn-secondary" id="new-game" type="button" disabled>New game</button>
        </div>
        <span id="you-chip"></span>
        <a href="/style-guide.html">Style guide</a>
      </div>
    </header>
    <main id="main" class="page-body table-layout">
      <section class="table-well" aria-label="Game table">
        <div class="arena table-arena" id="table"></div>
      </section>
      <aside class="side-col" aria-label="Your hand and table chat">
        <div class="hand-dock" id="hand-dock">
          <div id="hand" class="hand hand--play" aria-label="Your hand"></div>
        </div>
        <p id="phase-line" class="phase-line"></p>
        <div id="bots" class="bot-stepper" hidden>
          <span class="label">AI players</span>
          <button class="btn btn-secondary" id="bots-less" type="button" aria-label="Fewer AI players" disabled>−</button>
          <span id="bots-count" class="bot-count">0</span>
          <button class="btn btn-secondary" id="bots-more" type="button" aria-label="More AI players" disabled>+</button>
        </div>
        <div class="action-row" id="actions"></div>
        <div id="round-result" class="round-result"></div>
        <section class="panel chat-panel">
          <h2>Table chat</h2>
          <div id="chat-log" class="chat" aria-live="polite"></div>
          <form id="chat-form" class="chat-form">
            <label class="field">
              <span class="label">Message</span>
              <input class="input" id="chat-input" maxlength="200" autocomplete="off" />
            </label>
            <button class="btn btn-secondary" type="submit">Send</button>
          </form>
        </section>
      </aside>
    </main>
    <footer class="band">
      <span id="status" role="status">Pull up a chair</span>
    </footer>
    <p id="toast" class="toast table-toast" role="alert" hidden></p>

    <dialog id="hand-modal" aria-labelledby="hand-modal-title">
      <div class="modal-bar">
        <h2 id="hand-modal-title">Your hand</h2>
        <button class="btn btn-secondary" id="hand-close" type="button">Close</button>
      </div>
      <div id="lay-trays" class="lay-trays" hidden></div>
      <div class="hand-stage" id="hand-stage"></div>
      <div class="action-row" id="modal-actions"></div>
      <button class="btn btn-primary" id="lay-confirm" type="button" hidden>Lay these down</button>
    </dialog>

    <dialog id="stats-modal">
      <div id="stats-body" class="stats-body"></div>
      <button class="btn btn-secondary" id="stats-close" type="button">Close</button>
    </dialog>

    <dialog id="join-dialog">
      <form id="join-form" class="panel join-panel">
        <h2>Pull up a chair</h2>
        <p class="muted">One table is open. Take a seat with your name.</p>
        <label class="field">
          <span class="label">Your name</span>
          <input class="input" id="join-name" name="name" maxlength="20" autocomplete="nickname" required />
        </label>
        <button class="btn btn-primary" type="submit">Join the table</button>
      </form>
    </dialog>
    <script src="/js/main.js" type="module"></script>
  </body>
</html>
